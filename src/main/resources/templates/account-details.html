<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Capital - My Accounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-luxe">
        <div class="container">
            <a class="navbar-brand" href="#">AEGIS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: var(--gold);">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/dashboard}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/user/accounts}">Accounts</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/deposit}">Deposit</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/withdraw}">Withdraw</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/transfer}">Transfer</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/transactions}">History</a></li>
                    <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}"><span class="badge" style="background: var(--gold); color: var(--navy);">Admin</span></a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><span class="nav-link user-badge"><span style="display: inline-block; width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; margin-right: 8px;"></span><strong th:text="${user.fullName}">User</strong></span></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h4 class="page-header animate-slide-up">My Accounts</h4>
        <div class="row g-3">
            <div class="col-md-6" th:each="account : ${accounts}">
                <div class="balance-card animate-slide-up h-100">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <p class="label">Account Number</p>
                            <p class="account-number mb-3" th:text="${account.accountNumber}">AEG0000000</p>
                        </div>
                        <span class="badge" th:if="${account.active}" style="background: #2ecc71; color: white; border-radius: 50px; padding: 0.3rem 1rem; font-size: 0.75rem;">Active</span>
                        <span class="badge bg-secondary" th:unless="${account.active}">Inactive</span>
                    </div>
                    <p class="label">Available Balance</p>
                    <p class="balance-amount" th:text="'$' + ${#numbers.formatDecimal(account.balance, 1, 2)}">$0.00</p>
                    <p class="mt-3 mb-0" style="color: rgba(255,255,255,0.4); font-size: 0.8rem;">Opened <span th:text="${#temporals.format(account.createdAt, 'MMMM dd, yyyy')}">Date</span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-luxe text-center">
        <div class="container">
            <p class="mb-0">&copy; 2024 Aegis Capital. All rights reserved.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
