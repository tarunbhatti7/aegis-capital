<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Capital - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-wrapper" style="min-height: 60vh;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="login-card-luxe text-center">
                        <div class="card-body p-5">
                            <div style="font-size: 4rem; color: var(--gold); margin-bottom: 1rem;">&#9888;</div>
                            <h4 style="color: var(--navy); font-weight: 700; margin-bottom: 1rem;">Something Went Wrong</h4>
                            <p style="color: var(--gray-400); margin-bottom: 2rem;" th:text="${error}">Error message</p>
                            <a th:href="@{/user/dashboard}" class="btn btn-luxe-primary btn-lg px-5">
                                Return to Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
