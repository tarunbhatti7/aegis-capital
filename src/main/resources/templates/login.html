<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Capital - Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="login-card-luxe">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <h1 class="login-brand">AEGIS</h1>
                                <p class="login-subtitle">Capital Transaction Management</p>
                                <div class="mt-3" style="width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0 auto;"></div>
                            </div>

                            <div th:if="${param.registered}" class="alert alert-success border-0 rounded-3 mb-4">
                                Registration successful! Please login.
                            </div>
                            <div th:if="${param.logout}" class="alert alert-info border-0 rounded-3 mb-4">
                                You have been logged out.
                            </div>
                            <div th:if="${error}" class="alert alert-danger border-0 rounded-3 mb-4" th:text="${error}">
                            </div>

                            <form th:action="@{/login}" method="post" class="form-luxe">
                                <div class="mb-4">
                                    <label class="form-label">Username</label>
                                    <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter your username" required autofocus>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label">Password</label>
                                    <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter your password" required>
                                </div>
                                <button type="submit" class="btn btn-luxe-gold btn-lg w-100 mb-3">
                                    Sign In
                                </button>
                                <div class="text-center">
                                    <p class="mb-0" style="color: var(--gray-400);">New customer? <a th:href="@{/register}" style="color: var(--navy); font-weight: 600; text-decoration: none;">Create account</a></p>
                                </div>
                            </form>

                            <hr class="my-4" style="border-color: rgba(212,168,67,0.2);">
                            <div class="text-center">
                                <small style="color: var(--gray-400);">
                                    <strong style="color: var(--navy);">Demo Access</strong><br>
                                    <span class="badge bg-dark me-1">user1</span> <span class="text-muted">/</span> <span class="badge bg-dark me-1">password123</span><br>
                                    <span class="badge bg-dark me-1">admin</span> <span class="text-muted">/</span> <span class="badge bg-dark me-1">admin123</span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
