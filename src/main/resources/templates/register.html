<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Capital - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="login-card-luxe">
                        <div class="card-body">
                            <div class="text-center mb-4">
                                <h1 class="login-brand">AEGIS</h1>
                                <p class="login-subtitle">Open Your Account</p>
                                <div class="mt-3" style="width: 60px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0 auto;"></div>
                            </div>

                            <div th:if="${error}" class="alert alert-danger border-0 rounded-3 mb-4" th:text="${error}"></div>

                            <form th:action="@{/register}" method="post" class="form-luxe">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Full Name</label>
                                        <input type="text" name="fullName" class="form-control" placeholder="John Smith" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Username</label>
                                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" name="email" class="form-control" placeholder="john@email.com" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Phone</label>
                                        <input type="tel" name="phone" class="form-control" placeholder="+1-555-0000" required>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-4">
                                        <label class="form-label">Password</label>
                                        <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                                    </div>
                                    <div class="col-md-6 mb-4">
                                        <label class="form-label">Confirm Password</label>
                                        <input type="password" name="confirmPassword" class="form-control" placeholder="Confirm password" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-luxe-gold btn-lg w-100 mb-3">
                                    Create Account
                                </button>
                                <div class="text-center">
                                    <p class="mb-0" style="color: var(--gray-400);">Already registered? <a th:href="@{/login}" style="color: var(--navy); font-weight: 600; text-decoration: none;">Sign in</a></p>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
