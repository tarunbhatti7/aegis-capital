<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Capital - Transfer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-luxe">
        <div class="container">
            <a class="navbar-brand" href="#">AEGIS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" style="border-color: var(--gold);">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/dashboard}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/accounts}">Accounts</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/deposit}">Deposit</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/withdraw}">Withdraw</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/user/transfer}">Transfer</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/user/transactions}">History</a></li>
                    <li sec:authorize="hasRole('ADMIN')" class="nav-item">
                        <a class="nav-link" th:href="@{/admin/dashboard}"><span class="badge" style="background: var(--gold); color: var(--navy);">Admin</span></a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><span class="nav-link user-badge"><span style="display: inline-block; width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; margin-right: 8px;"></span><strong th:text="${user.fullName}">User</strong></span></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h4 class="page-header animate-slide-up">Transfer Funds</h4>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card-luxe animate-slide-up stagger-1">
                    <div class="card-header">
                        <h5 class="mb-0">Transfer Funds</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger border-0 rounded-3" th:text="${error}"></div>

                        <form th:action="@{/user/transfer}" th:object="${transactionRequest}" method="post" class="form-luxe">
                            <div class="mb-4">
                                <label class="form-label">From Account</label>
                                <select th:field="*{accountNumber}" class="form-select" required>
                                    <option value="">-- Choose Source Account --</option>
                                    <option th:each="acc : ${accounts}"
                                            th:value="${acc.accountNumber}"
                                            th:text="${acc.accountNumber} + '  |  $' + ${#numbers.formatDecimal(acc.balance, 1, 2)}">
                                    </option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('accountNumber')}" th:errors="*{accountNumber}"></div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">To Account Number</label>
                                <input type="text" th:field="*{targetAccountNumber}" class="form-control"
                                       placeholder="Enter destination account number (e.g., AEG0000000003)" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('targetAccountNumber')}" th:errors="*{targetAccountNumber}"></div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Amount ($)</label>
                                <div class="input-group">
                                    <span class="input-group-text" style="background: var(--navy); color: var(--gold); border: 2px solid #e0e3e8; border-right: none; font-weight: 700;">$</span>
                                    <input type="number" th:field="*{amount}" step="0.01" min="0.01"
                                           class="form-control" placeholder="0.00" required style="border-left: none;">
                                </div>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Description <span style="color: var(--gray-400); font-weight: 400;">(optional)</span></label>
                                <input type="text" th:field="*{description}" class="form-control" placeholder="e.g., Rent payment">
                            </div>
                            <button type="submit" class="btn btn-luxe-warning btn-lg w-100">
                                &#8594; Transfer Now
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-luxe text-center mt-4">
        <div class="container">
            <p class="mb-0">&copy; 2024 Aegis Capital. All rights reserved.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
